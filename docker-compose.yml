services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: statanalysis_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statpass}
      POSTGRES_DB: ${POSTGRES_DB:-statanalysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statuser} -d ${POSTGRES_DB:-statanalysis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: statanalysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: statanalysis_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://statuser:statpass@db:5432/statanalysis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
